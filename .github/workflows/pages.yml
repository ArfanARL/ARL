name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build static site
        env:
          PAGES_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /ARL
          NEXT_PUBLIC_SITE_URL: https://arfanarl.github.io/ARL
        run: npm run build
      - name: Remove admin console from the static site (it needs the Core API)
        run: rm -rf .next-export/admin && touch .next-export/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/.next-export

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
